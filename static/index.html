<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hangman</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Hangman</h1>
      <form id="new-game-form" class="controls">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button type="submit" id="new-game">New game</button>
      </form>
    </header>

    <section class="board" aria-label="Game board">
      <svg id="drawing" class="drawing" viewBox="0 0 200 220" role="img" aria-labelledby="drawing-title">
        <title id="drawing-title">Hangman drawing</title>
        <g class="gallows">
          <line x1="20" y1="210" x2="150" y2="210"/>
          <line x1="50" y1="210" x2="50" y2="20"/>
          <line x1="50" y1="20" x2="130" y2="20"/>
          <line x1="130" y1="20" x2="130" y2="45"/>
        </g>
        <g class="figure">
          <circle class="part" cx="130" cy="62" r="17"/>
          <line class="part" x1="130" y1="79" x2="130" y2="135"/>
          <line class="part" x1="130" y1="95" x2="105" y2="120"/>
          <line class="part" x1="130" y1="95" x2="155" y2="120"/>
          <line class="part" x1="130" y1="135" x2="110" y2="172"/>
          <line class="part" x1="130" y1="135" x2="150" y2="172"/>
        </g>
      </svg>

      <div class="info">
        <p id="pattern" class="pattern" aria-label="No game in progress"></p>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <dl class="stats">
          <div><dt>Remaining</dt><dd id="remaining">–</dd></div>
          <div><dt>Guessed</dt><dd id="guessed">–</dd></div>
          <div><dt>Incorrect</dt><dd id="incorrect">–</dd></div>
        </dl>
      </div>
    </section>

    <section id="keyboard" class="keyboard" aria-label="Letters"></section>
  </main>
</body>
</html>
