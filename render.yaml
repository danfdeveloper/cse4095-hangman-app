# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hangman
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: active games are kept in that process's memory.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
